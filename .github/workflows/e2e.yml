name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on new commits for the same ref
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Cypress
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Installs dependencies and runs `npm test` in Chrome
      - name: Cypress run
        uses: cypress-io/github-action@v7.4.8
        with:
          browser: chrome
          command: npm test

      # Upload screenshots only if tests fail
      - name: Upload screenshots (failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 2
